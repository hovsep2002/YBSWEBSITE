# Netlify build settings (read automatically when the site is linked to this repo)
[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

# Keep the admin panel out of search engines
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

# Always check for a fresh page so edits to the code show up right away
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
